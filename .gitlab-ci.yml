stages:
  - build
  - deploy

variables:
  # GitLab > Settings > CI/CD > Variables (masquées / protégées sur main)
  #
  # AZURE_CLIENT_ID
  # AZURE_CLIENT_SECRET
  # AZURE_TENANT_ID
  # AZURE_SUBSCRIPTION_ID
  # AZURE_RESOURCE_GROUP
  # AZURE_FUNCTION_APP_NAME
  # AZURE_WEBAPP_API_NAME          (défaut: api-doc-pipeline-jn-a6h4cug9eeh4ajbp)
  # AZURE_STATIC_WEB_APP_TOKEN     (optionnel — souvent bloqué sur Azure for Students)
  # VITE_FUNCTIONS_BASE_URL        (URL Function App sans /api, pour SignalR en prod)
  # COSMOS_ENDPOINT
  # COSMOS_KEY
  # SERVICE_BUS_CONNECTION_STRING
  # SIGNALR_CONNECTION_STRING
  # OPENAI_API_KEY
  # BLOB_CONNECTION_STRING
  # VITE_API_URL                   (ex. https://api-doc-pipeline-jn-a6h4cug9eeh4ajbp.austriaeast-01.azurewebsites.net)

# ==============================================================================
# FRONTEND REACT
# SWA souvent impossible sur Azure for Students → site statique Storage ($web)
# ==============================================================================
build_frontend:
  stage: build
  image: node:22-alpine
  script:
    - cd src/web
    - npm ci
    - export VITE_API_URL="${VITE_API_URL:-https://api-doc-pipeline-jn-a6h4cug9eeh4ajbp.austriaeast-01.azurewebsites.net}"
    - export VITE_FUNCTIONS_BASE_URL="${VITE_FUNCTIONS_BASE_URL:-https://func-doc-pipeline-jn-hnd2ethah8gtcpg8.austriaeast-01.azurewebsites.net}"
    - npm run build
  artifacts:
    paths:
      - src/web/dist/
    expire_in: 1 day
  rules:
    - if: $CI_COMMIT_BRANCH == "main"

# Hébergement React sur le Storage existant (fonctionne sur abonnement étudiant)
deploy_frontend_storage:
  stage: deploy
  image: mcr.microsoft.com/azure-cli
  needs:
    - build_frontend
  script:
    - az login --service-principal -u "$AZURE_CLIENT_ID" -p "$AZURE_CLIENT_SECRET" --tenant "$AZURE_TENANT_ID"
    - az account set --subscription "$AZURE_SUBSCRIPTION_ID"
    - STORAGE_ACCOUNT=$(echo "$BLOB_CONNECTION_STRING" | sed -n 's/.*AccountName=\([^;]*\).*/\1/p')
    - test -n "$STORAGE_ACCOUNT"
    - >
      az storage blob service-properties update
      --account-name "$STORAGE_ACCOUNT"
      --connection-string "$BLOB_CONNECTION_STRING"
      --static-website
      --index-document index.html
      --404-document index.html
    - >
      az storage blob upload-batch
      --destination '$web'
      --source src/web/dist
      --connection-string "$BLOB_CONNECTION_STRING"
      --overwrite
    - STATIC_URL=$(az storage account show --name "$STORAGE_ACCOUNT" --query "primaryEndpoints.web" -o tsv)
    - echo "Frontend URL => ${STATIC_URL}"
  rules:
    - if: $CI_COMMIT_BRANCH == "main"

# Static Web App — uniquement si vous avez un token (souvent indisponible en étudiant)
deploy_frontend_swa:
  stage: deploy
  image: node:22-alpine
  needs:
    - build_frontend
  script:
    - npm install -g @azure/static-web-apps-cli
    - swa deploy ./src/web/dist --deployment-token "$AZURE_STATIC_WEB_APP_TOKEN" --env production
  rules:
    - if: $CI_COMMIT_BRANCH == "main" && $AZURE_STATIC_WEB_APP_TOKEN != null && $AZURE_STATIC_WEB_APP_TOKEN != ""

# ==============================================================================
# API FASTAPI (App Service Linux — zip deploy)
# ==============================================================================
deploy_api:
  stage: deploy
  image: mcr.microsoft.com/azure-cli
  variables:
    API_APP_NAME: "${AZURE_WEBAPP_API_NAME:-api-doc-pipeline-jn-a6h4cug9eeh4ajbp}"
  script:
    - az login --service-principal -u "$AZURE_CLIENT_ID" -p "$AZURE_CLIENT_SECRET" --tenant "$AZURE_TENANT_ID"
    - az account set --subscription "$AZURE_SUBSCRIPTION_ID"
    - >
      az webapp config appsettings set
      --resource-group "$AZURE_RESOURCE_GROUP"
      --name "$API_APP_NAME"
      --settings
      COSMOS_ENDPOINT="$COSMOS_ENDPOINT"
      COSMOS_KEY="$COSMOS_KEY"
      COSMOS_DATABASE="db-doc"
      COSMOS_CONTAINER="jobs"
      BLOB_CONNECTION_STRING="$BLOB_CONNECTION_STRING"
      BLOB_CONTAINER="doc-storage"
      SCM_DO_BUILD_DURING_DEPLOYMENT="true"
      WEBSITES_PORT="8000"
    - >
      az webapp config set
      --resource-group "$AZURE_RESOURCE_GROUP"
      --name "$API_APP_NAME"
      --startup-file "python -m uvicorn app.main:app --host 0.0.0.0 --port 8000"
    - apk add --no-cache zip
    - cd src/api
    - zip -r ../../api.zip . -x "**/__pycache__/*" -x "*.pyc" -x ".env*"
    - cd ../..
    - az webapp deployment source config-zip --resource-group "$AZURE_RESOURCE_GROUP" --name "$API_APP_NAME" --src api.zip
    - az webapp restart --resource-group "$AZURE_RESOURCE_GROUP" --name "$API_APP_NAME"
    - sleep 30
    - curl -fsS "https://${API_APP_NAME}.azurewebsites.net/health"
  rules:
    - if: $CI_COMMIT_BRANCH == "main"

# ==============================================================================
# BACKEND AZURE FUNCTIONS (Worker)
# ==============================================================================
deploy_functions:
  stage: deploy
  image: mcr.microsoft.com/azure-cli
  script:
    - az login --service-principal -u "$AZURE_CLIENT_ID" -p "$AZURE_CLIENT_SECRET" --tenant "$AZURE_TENANT_ID"
    - az account set --subscription "$AZURE_SUBSCRIPTION_ID"
    - >
      az functionapp config appsettings set
      --resource-group "$AZURE_RESOURCE_GROUP"
      --name "$AZURE_FUNCTION_APP_NAME"
      --settings
      COSMOS_ENDPOINT="$COSMOS_ENDPOINT"
      COSMOS_KEY="$COSMOS_KEY"
      COSMOS_DATABASE="db-doc"
      COSMOS_CONTAINER="jobs"
      SERVICE_BUS_CONNECTION_STRING="$SERVICE_BUS_CONNECTION_STRING"
      SERVICE_BUS_QUEUE_NAME="document-processing"
      SIGNALR_CONNECTION_STRING="$SIGNALR_CONNECTION_STRING"
      OPENAI_API_KEY="$OPENAI_API_KEY"
      OPENAI_MODEL="gpt-4o-mini"
      BLOB_CONNECTION_STRING="$BLOB_CONNECTION_STRING"
      docstorageprof_STORAGE="$BLOB_CONNECTION_STRING"
      AzureWebJobsStorage="$BLOB_CONNECTION_STRING"
      FUNCTIONS_WORKER_RUNTIME="python"
    - apk add --no-cache zip
    - cd src/functions/worker
    - zip -r ../../../function.zip . -x ".venv/*" -x "__pycache__/*" -x "**/__pycache__/*" -x "*.pyc" -x "local.settings.json"
    - cd ../../../
    - az functionapp deployment source config-zip --resource-group "$AZURE_RESOURCE_GROUP" --name "$AZURE_FUNCTION_APP_NAME" --src function.zip
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
